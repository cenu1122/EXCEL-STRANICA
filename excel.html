<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Excel Baza - Resize</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f7f6; }
        .toolbar { 
            margin-bottom: 20px; padding: 15px; background: white; 
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }
        button { 
            padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; 
            font-weight: bold; transition: 0.2s;
        }
        .btn-add { background: #217346; color: white; }
        .btn-col { background: #2b579a; color: white; }
        .btn-save { background: #0078d4; color: white; }
        
        table { border-collapse: collapse; table-layout: fixed; width: 100%; background: white; }
        th, td { 
            border: 1px solid #ccc; padding: 12px; outline: none; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            position: relative; 
        }
        th { background: #f8f9fa; text-align: left; }

        /* Držači za resize (nevidljive zone za hvatanje mišem) */
        .resizer-r {
            position: absolute; right: 0; top: 0; height: 100%; width: 5px;
            cursor: col-resize; z-index: 1;
        }
        .resizer-b {
            position: absolute; left: 0; bottom: 0; width: 100%; height: 5px;
            cursor: row-resize; z-index: 1;
        }

        .duplicate { background-color: #ff4d4d !important; color: white !important; }
        .status { font-size: 13px; color: #666; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn-add" onclick="addRow()">➕ Dodaj red</button>
        <button class="btn-col" onclick="addColumn()">➕ Dodaj kolonu</button>
        <button class="btn-save" onclick="snimiKaoFajl()">💾 Snimi</button>
        <span class="status" id="status-text">Povuci ivice kolona ili redova za promjenu veličine.</span>
    </div>

    <table id="myTable">
        <thead>
            <tr id="header-row">
                <th style="width: 60px;">ID<div class="resizer-r"></div></th>
                <th contenteditable="true" style="width: 250px;">Naziv Stavke<div class="resizer-r"></div></th>
                <th contenteditable="true" style="width: 200px;">Vrijednost (KM)<div class="resizer-r"></div></th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        // --- RESIZE LOGIKA ---
        let currentResizer;

        document.addEventListener('mousedown', function(e) {
            if (e.target.classList.contains('resizer-r') || e.target.classList.contains('resizer-b')) {
                currentResizer = e.target;
                let parent = currentResizer.parentElement;
                let startX = e.pageX;
                let startY = e.pageY;
                let startW = parent.offsetWidth;
                let startH = parent.offsetHeight;

                function onMouseMove(e) {
                    if (currentResizer.classList.contains('resizer-r')) {
                        parent.style.width = (startW + (e.pageX - startX)) + 'px';
                    } else {
                        parent.parentElement.style.height = (startH + (e.pageY - startY)) + 'px';
                    }
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }
        });

        // --- OSTALE FUNKCIJE ---
        function provjeriDuplikate() {
            let cells = document.querySelectorAll("#table-body td[contenteditable='true']");
            let map = {};
            cells.forEach(c => c.classList.remove("duplicate"));
            cells.forEach(c => {
                let txt = c.innerText.trim();
                if (txt !== "" && txt !== "0.00") {
                    if (!map[txt]) map[txt] = [];
                    map[txt].push(c);
                }
            });
            for (let key in map) {
                if (map[key].length > 1) map[key].forEach(c => c.classList.add("duplicate"));
            }
        }

        function addColumn() {
            let headerRow = document.getElementById("header-row");
            let tbody = document.getElementById("table-body");
            let newTh = document.createElement("th");
            newTh.innerHTML = 'Nova Kolona<div class="resizer-r"></div>';
            newTh.contentEditable = "true";
            headerRow.appendChild(newTh);

            Array.from(tbody.rows).forEach(row => {
                let cell = row.insertCell();
                cell.contentEditable = "true";
                cell.oninput = autoSave;
            });
            autoSave();
        }

        function addRow() {
            let tbody = document.getElementById("table-body");
            let headerCount = document.getElementById("header-row").cells.length;
            let row = tbody.insertRow();
            
            let idCell = row.insertCell();
            idCell.innerHTML = `${tbody.rows.length}<div class="resizer-b"></div>`;
            idCell.style.textAlign = "center";

            for (let i = 1; i < headerCount; i++) {
                let cell = row.insertCell();
                cell.contentEditable = "true";
                cell.oninput = autoSave;
                if (i === 2) cell.innerText = "0.00";
            }
            autoSave();
        }

        function autoSave() {
            provjeriDuplikate();
            localStorage.setItem("zadnje_stanje_resize", JSON.stringify(pokupiPodatkeIzTabele()));
        }

        function pokupiPodatkeIzTabele() {
            let rows = [];
            document.querySelectorAll("#table-body tr").forEach(tr => {
                let rowData = [];
                for (let i = 1; i < tr.cells.length; i++) rowData.push(tr.cells[i].innerText);
                rows.push(rowData);
            });
            return rows;
        }

        function popuniTabelu(podaci) {
            let tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            podaci.forEach((rowData, index) => {
                let row = tbody.insertRow();
                let idCell = row.insertCell();
                idCell.innerHTML = `${index + 1}<div class="resizer-b"></div>`;
                rowData.forEach(val => {
                    let cell = row.insertCell();
                    cell.contentEditable = "true";
                    cell.innerText = val;
                    cell.oninput = autoSave;
                });
            });
            provjeriDuplikate();
        }

        function snimiKaoFajl() {
            let blob = new Blob([JSON.stringify(pokupiPodatkeIzTabele(), null, 2)], {type: "application/json"});
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "tabela.json";
            a.click();
        }

        window.onload = () => {
            let proslo = localStorage.getItem("zadnje_stanje_resize");
            if (proslo) popuniTabelu(JSON.parse(proslo));
            else addRow();
        };
    </script>
</body>
</html>
